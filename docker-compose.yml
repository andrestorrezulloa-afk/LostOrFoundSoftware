services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: lostfound
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
volumes:
  pgdata: