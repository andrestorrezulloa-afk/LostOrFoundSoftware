<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienestar Estudiantil - Objetos Perdidos</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
  <!-- autenticacion pantalla-->
    <section id="seccion-auth" class="auth-wrapper">
      <div class="auth-card">
        <h1>Bienestar Estudiantil</h1>
        <p class="auth-subtitle">Administración de Objetos Perdidos</p>

        <div id="mensaje-sistema" class="mensaje"></div>

        <div id="vista-login">
          <h2>Iniciar Sesión</h2>
          <form id="login-form">
            <div class="form-group">
              <label for="login-correo">Correo institucional</label>
              <input
                type="email"
                id="login-correo"
                placeholder="ejemplo@ucb.edu.bo"
              />
            </div>
            <div class="form-group">
              <label for="login-password">Contraseña</label>
              <input
                type="password"
                id="login-password"
                placeholder="Ingresa tu contraseña"
              />
            </div>
            <button type="submit" id="btn-login" class="btn-primary">
              Iniciar sesión
            </button>
          </form>

          <div class="switch-view">
            ¿No tienes una cuenta?
            <button type="button" id="ir-a-registro" class="btn-link">
              Crear cuenta
            </button>
          </div>
        </div>

        <div id="vista-registro" style="display: none;">
          <h2>Crear Cuenta de Personal</h2>
          <form id="registro-form">
            <div class="form-group">
              <label for="reg-correo">Correo institucional</label>
              <input
                type="email"
                id="reg-correo"
                placeholder="ejemplo@ucb.edu.bo"
              />
            </div>
            <div class="form-group">
              <label for="reg-password">Contraseña</label>
              <input
                type="password"
                id="reg-password"
                placeholder="Crea una contraseña"
              />
            </div>
            <button type="submit" id="btn-registrar" class="btn-primary">
              Crear cuenta
            </button>
          </form>

          <div class="switch-view">
            ¿Ya tienes una cuenta?
            <button type="button" id="ir-a-login" class="btn-link">
              Iniciar sesión
            </button>
          </div>
        </div>
      </div>
    </section>

    
    <div id="estado-acceso" style="display: none;">
      Acceso denegado: debe iniciar sesion
    </div>

    <!-- pantalla de gestion -->
    <section id="panel-gestion" class="panel-container" style="display: none;">
      <header class="topbar">
        <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
      </header>

      <!-- area limpia para agregar las demas pantallas -->
      <main id="contenido-objetos" class="contenido-principal"></main>
    </section>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
